name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installe les dépendances
        run: pip install -r requirements-dev.txt
      - name: Vérifie le formatage (black)
        run: black --check src tests examples
      - name: Analyse statique (flake8)
        run: flake8 --max-line-length=100 src tests examples

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installe les dépendances
        run: pip install -r requirements-dev.txt
      - name: Exécute les tests unitaires
        run: pytest -v
